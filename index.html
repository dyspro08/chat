<!doctype html>
<!--
  파일 목적: Firebase 기반 소규모 채팅 사이트의 단일 HTML 진입점을 제공한다.
  책임 범위: 앱 레이아웃, 접근성 레이블, Firebase 모듈을 실행할 app.js 연결을 담당한다.
  관련 모듈: app.js, style.css.
-->
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f4ef" />
    <title>Chat Ver2</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="top-bar">
        <div class="brand-block" aria-label="사이트 정보">
          <p class="eyebrow">dyspro08.github.io/chat</p>
          <h1>Chat Ver2</h1>
        </div>

        <div class="top-actions">
          <form id="profile-form" class="profile-form" hidden>
            <label class="sr-only" for="profile-name">닉네임</label>
            <input id="profile-name" name="profileName" maxlength="40" autocomplete="nickname" />
            <button class="quiet-button" type="submit">저장</button>
          </form>

          <button id="notification-button" class="quiet-button" type="button">알림 켜기</button>
          <button id="theme-button" class="quiet-button" type="button">테마</button>
          <button id="sign-in-button" class="primary-button" type="button">Google 로그인</button>
          <button id="sign-out-button" class="quiet-button" type="button" hidden>로그아웃</button>
        </div>
      </header>

      <aside class="primary-rail" aria-label="주요 메뉴">
        <button class="rail-button is-active" type="button" aria-label="전체 채팅" data-view="general">전체</button>
        <button class="rail-button" type="button" aria-label="개인 대화 안내" data-view="direct">DM</button>
      </aside>

      <aside class="conversation-panel" aria-label="대화 목록">
        <section class="panel-section">
          <div class="section-title-row">
            <h2>채널</h2>
          </div>
          <button id="general-chat-button" class="conversation-button is-active" type="button">
            <span class="conversation-name">전체 채팅</span>
            <span class="conversation-meta">로그인한 사용자 모두</span>
          </button>
        </section>

        <section class="panel-section">
          <div class="section-title-row">
            <h2>개인 대화</h2>
          </div>
          <p class="helper-text">오른쪽 사용자 목록에서 대화할 사람을 선택하세요.</p>
        </section>
      </aside>

      <main class="chat-main" aria-label="채팅 화면">
        <section class="chat-header">
          <div>
            <p id="active-context" class="eyebrow">전체 채팅</p>
            <h2 id="active-title">로그인이 필요합니다</h2>
          </div>
          <p id="auth-summary" class="auth-summary">Google 로그인 후 메시지를 주고받을 수 있습니다.</p>
        </section>

        <section id="message-list" class="message-list" aria-live="polite" aria-relevant="additions text"></section>

        <button id="new-message-button" class="new-message-button" type="button" hidden>새 메시지 보기</button>

        <form id="message-form" class="composer" aria-label="메시지 작성">
          <label class="sr-only" for="message-input">메시지</label>
          <textarea
            id="message-input"
            rows="1"
            maxlength="500"
            placeholder="로그인 후 메시지를 입력하세요"
            disabled
          ></textarea>
          <div class="composer-footer">
            <p id="status-line" class="status-line" role="status">준비 중입니다.</p>
            <div class="composer-actions">
              <span id="message-count" class="message-count">0/500</span>
              <button id="send-button" class="primary-button" type="submit" disabled>전송</button>
            </div>
          </div>
        </form>
      </main>

      <aside class="member-panel" aria-label="등록 사용자">
        <div class="section-title-row">
          <h2>사용자</h2>
          <span id="member-count" class="member-count">0명</span>
        </div>
        <div id="member-list" class="member-list"></div>
      </aside>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
