<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase 채팅 테스트</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="chat-container">
        <div id="chat-window">
            </div>

        <div id="attachment-menu">
            <label for="image-input">🖼️ 이미지</label>
            <label for="file-input">📄 파일</label>
        </div>

        <input type="file" id="image-input" accept="image/*">
        <input type="file" id="file-input">

        <form id="message-form">
            <button type="button" id="attachment-button">+</button>
            
            <input type="text" id="message-input" placeholder="메시지를 입력하세요..." autocomplete="off">
            
            <button type="submit">전송</button>
        </form>
    </div>

    <script src="app.js"></script>
</body>
</html>
