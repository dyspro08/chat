<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Discord Style Chat</title>
    <!-- 제공해주신 아이콘 이미지 적용 -->
    <link rel="icon" href="./ChatGPT Image 2026년 9월 6일 오후 10_02_51.png" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#1e1f22" />
  </head>
  <body>
    <div class="app-shell">
      <nav class="server-rail" aria-label="서버 목록">
        <button id="rail-home-btn" class="rail-item is-active" type="button" title="홈">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
            <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
          </svg>
        </button>
        <div class="rail-divider"></div>
        <button id="rail-general-btn" class="rail-item" type="button" title="전체 서버">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
          </svg>
        </button>
        <div id="dynamic-server-list" class="dynamic-server-list"></div>
        <button id="add-server-btn" class="rail-item add-btn" type="button" title="서버 만들기">
          <span>+</span>
        </button>
        <button id="join-server-open-btn" class="rail-item join-btn" type="button" title="초대 코드로 서버 참가">
          <span>🔗</span>
        </button>
      </nav>
      <aside class="sub-sidebar" aria-label="대화 목록">
        <div class="sidebar-header">
          <h2 id="sidebar-title">대화</h2>
        </div>
        <div class="sidebar-content">
          <div class="sidebar-section">
            <div class="section-label">최근 대화</div>
            <div id="dm-list" class="dm-list"></div>
          </div>
        </div>
        <div class="user-profile-bar">
          <div class="user-profile-info">
            <div id="my-avatar" class="avatar avatar-small">?</div>
            <div class="user-text">
              <span id="my-name" class="user-name">로그인 필요</span>
              <span id="my-status" class="user-status-text">오프라인</span>
            </div>
          </div>
          <button id="open-settings-btn" class="icon-button" type="button" title="설정">
            ⚙️
          </button>
        </div>
      </aside>
      <main class="main-area">
        <section id="home-view" class="view-panel">
          <header class="main-header">
            <div class="header-title">
              <span class="header-icon">🏠</span>
              <h2>홈</h2>
            </div>
          </header>
          <div class="home-body">
            <div class="search-box">
              <span class="search-icon">🔍</span>
              <input id="user-search-input" type="text" placeholder="사용자 검색" />
            </div>
            <div class="user-section">
              <h3 id="user-count-label" class="section-subtitle">접속 중인 사용자 (0)</h3>
              <div id="user-grid" class="user-grid"></div>
            </div>
          </div>
        </section>
        <section id="chat-view" class="view-panel" hidden>
          <header class="main-header">
            <div class="header-title">
              <span id="chat-header-prefix" class="header-prefix">#</span>
              <h2 id="chat-header-title">전체 채팅</h2>
            </div>
            <span id="chat-header-context" class="header-context">공개 채널</span>
          </header>
          <div id="message-list" class="message-list" aria-live="polite"></div>
          <button id="new-message-button" class="new-message-button" type="button" hidden>새 메시지 보기</button>
          <form id="message-form" class="composer-form">
            <div class="composer-inner">
              <textarea
                id="message-input"
                rows="1"
                maxlength="500"
                placeholder="메시지를 입력하세요..."
                disabled
              ></textarea>
              <button id="send-button" type="submit" class="send-button" disabled>전송</button>
            </div>
            <div class="composer-status-bar">
              <span id="status-line" class="status-line">준비 중입니다.</span>
              <span id="message-count" class="message-count">0/500</span>
            </div>
          </form>
        </section>
      </main>
    </div>

    <!-- 각종 모달창들 -->
    <div id="settings-modal" class="modal-overlay" hidden>
      <div class="modal-card">
        <div class="modal-header">
          <h3>설정</h3>
          <button id="close-settings-btn" class="modal-close-btn" type="button">✕</button>
        </div>
        <div class="modal-body">
          <form id="profile-form" class="settings-form">
            <label for="profile-name">닉네임 변경</label>
            <div class="input-group">
              <input id="profile-name" type="text" maxlength="40" autocomplete="nickname" />
              <button class="primary-button" type="submit">저장</button>
            </div>
          </form>
          <div class="settings-actions">
            <button id="notification-button" class="secondary-button" type="button">알림 켜기</button>
            <button id="sign-in-button" class="primary-button" type="button">Google 로그인</button>
            <button id="sign-out-button" class="danger-button" type="button" hidden>로그아웃</button>
          </div>
        </div>
      </div>
    </div>

    <div id="create-server-modal" class="modal-overlay" hidden>
      <div class="modal-card">
        <div class="modal-header">
          <h3>서버 만들기</h3>
          <button id="close-server-btn" class="modal-close-btn" type="button">✕</button>
        </div>
        <form id="create-server-form" class="modal-body">
          <label for="server-name-input">서버 이름</label>
          <input id="server-name-input" type="text" placeholder="새 서버 이름" maxlength="30" required />
          <div class="modal-footer">
            <button id="cancel-server-btn" class="secondary-button" type="button">취소</button>
            <button type="submit" class="primary-button">생성</button>
          </div>
        </form>
      </div>
    </div>

    <div id="join-server-modal" class="modal-overlay" hidden>
      <div class="modal-card">
        <div class="modal-header">
          <h3>서버 참가하기</h3>
          <button id="close-join-server-btn" class="modal-close-btn" type="button">✕</button>
        </div>
        <form id="join-server-form" class="modal-body">
          <label for="invite-code-input">초대 코드 6자리</label>
          <input id="invite-code-input" type="text" placeholder="예: A8F3X1" maxlength="6" required style="text-transform: uppercase;" />
          <div class="modal-footer">
            <button id="cancel-join-server-btn" class="secondary-button" type="button">취소</button>
            <button type="submit" class="primary-button">참가</button>
          </div>
        </form>
      </div>
    </div>

    <!-- [추가됨] 우클릭 컨텍스트 메뉴 -->
    <div id="server-context-menu" class="context-menu" hidden>
      <button id="ctx-server-settings-btn" class="context-menu-item">서버 설정</button>
    </div>

    <!-- [추가됨] 서버 설정 및 삭제 모달 -->
    <div id="server-settings-modal" class="modal-overlay" hidden>
      <div class="modal-card">
        <div class="modal-header">
          <h3>서버 설정</h3>
          <button id="close-server-settings-btn" class="modal-close-btn" type="button">✕</button>
        </div>
        <div class="modal-body">
          <p class="helper-text" style="margin-bottom: 16px;">서버 관리자(생성자)만 접근 가능한 설정입니다.</p>
          <div class="settings-actions">
            <button id="clear-server-chat-btn" class="secondary-button" type="button">채팅 내역 비우기</button>
            <button id="delete-server-btn" class="danger-button" type="button">서버 삭제</button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
