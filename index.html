<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>채팅 앱</title>
  
  <!-- PWA를 위한 manifest와 테마 컬러 설정 -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#5865f2">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <!-- 1. 좌측 서버 레일 -->
    <div class="server-rail">
      <button class="rail-item is-active">홈</button>
      <div class="rail-divider"></div>
      <div class="dynamic-server-list" id="server-list">
        <!-- 서버 리스트가 동적으로 들어갈 자리 -->
      </div>
      <button class="rail-item add-btn" id="open-create-server-btn">+</button>
      <button class="rail-item" style="color: #43b581; font-size: 20px;" id="open-join-server-btn">🧭</button> <!-- 참가 버튼 추가 -->
    </div>

    <!-- 2. 서브 사이드바 -->
    <div class="sub-sidebar">
      <div class="sidebar-header">
        <h2 id="current-server-name">홈</h2>
        <button class="icon-button" id="open-server-settings-btn" title="서버 설정">⚙️</button> <!-- 서버 설정 버튼 추가 -->
      </div>
      <div class="sidebar-content" id="channel-list">
        <!-- 채널 리스트 들어갈 자리 -->
      </div>
      <!-- 유저 프로필 바 -->
      <div class="user-profile-bar">
        <div class="user-profile-info">
          <div class="avatar avatar-small">U</div>
          <div class="user-text">
            <span class="user-name">사용자</span>
            <span class="user-status-text">온라인</span>
          </div>
        </div>
        <button class="icon-button" id="open-user-settings-btn">⚙️</button>
      </div>
    </div>

    <!-- 3. 메인 채팅 영역 -->
    <div class="main-area">
      <div class="main-header">
        <span class="header-prefix">#</span>
        <strong id="current-channel-name">일반 채팅</strong>
      </div>
      <div class="message-list" id="message-list">
        <!-- 채팅 메시지 들어갈 자리 -->
      </div>
      <div class="composer-form">
        <div class="composer-inner">
          <textarea id="message-input" placeholder="메시지 보내기..." rows="1"></textarea>
          <button class="send-button" id="send-btn">전송</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ================= 모달 창 모음 ================= -->

  <!-- 서버 만들기 모달 -->
  <div id="create-server-modal" class="modal-overlay" hidden>
    <div class="modal-card">
      <div class="modal-header">
        <h2>서버 만들기</h2>
        <button class="modal-close-btn" onclick="document.getElementById('create-server-modal').hidden = true">✕</button>
      </div>
      <div class="modal-body">
        <input type="text" id="new-server-name" placeholder="새 서버 이름">
      </div>
      <div class="modal-footer">
        <button class="secondary-button" onclick="document.getElementById('create-server-modal').hidden = true">취소</button>
        <button class="primary-button" id="create-server-btn">생성</button>
      </div>
    </div>
  </div>

  <!-- 서버 참가하기 모달 (추가됨) -->
  <div id="join-server-modal" class="modal-overlay" hidden>
    <div class="modal-card">
      <div class="modal-header">
        <h2>서버 참가하기</h2>
        <button class="modal-close-btn" onclick="document.getElementById('join-server-modal').hidden = true">✕</button>
      </div>
      <div class="modal-body">
        <input type="text" id="invite-code-input" placeholder="초대 코드 6자리 입력">
      </div>
      <div class="modal-footer">
        <button class="secondary-button" onclick="document.getElementById('join-server-modal').hidden = true">취소</button>
        <button class="primary-button" id="join-server-btn">참가</button>
      </div>
    </div>
  </div>

  <!-- 서버 설정 (프로필 수정) 모달 (추가됨) -->
  <div id="server-settings-modal" class="modal-overlay" hidden>
    <div class="modal-card">
      <div class="modal-header">
        <h2>서버 프로필 수정</h2>
        <button class="modal-close-btn" onclick="document.getElementById('server-settings-modal').hidden = true">✕</button>
      </div>
      <div class="modal-body">
        <input type="text" id="edit-server-name" placeholder="새 서버 이름">
        <input type="text" id="edit-server-icon" placeholder="서버 아이콘 이미지 URL (선택사항)" style="margin-top: 10px;">
      </div>
      <div class="modal-footer">
        <button class="primary-button" id="update-server-btn">변경 저장</button>
      </div>
    </div>
  </div>

  <!-- 유저 설정 모달 (배경 커스텀 기능 추가됨) -->
  <div id="user-settings-modal" class="modal-overlay" hidden>
    <div class="modal-card">
      <div class="modal-header">
        <h2>사용자 설정</h2>
        <button class="modal-close-btn" onclick="document.getElementById('user-settings-modal').hidden = true">✕</button>
      </div>
      <div class="modal-body">
        <div class="input-group">
          <input type="text" id="bg-url-input" placeholder="개인 배경화면 이미지 URL">
          <button class="secondary-button" id="save-bg-btn">배경 적용</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
